fragment InbaReleaseSlugEntity on InbaRelease {
  documentId
  title
  slug
}

fragment InbaReleaseCardEntity on InbaRelease {
  ...InbaReleaseSlugEntity
  perex
  releaseDate
  coverImage {
    ...UploadImageEntity
  }
}

fragment InbaReleaseEntity on InbaRelease {
  ...InbaReleaseCardEntity
  rearImage {
    ...UploadImageEntity
  }
  files {
    ...FileBlock
  }
  articles {
    ...ArticleCardEntity
  }
  featuredArticles {
    ...ArticleCardEntity
  }
}

fragment InbaReleaseHomepageInbaCardEntity on InbaRelease {
  documentId
  coverImage {
    ...UploadImageEntity
  }
  rearImage {
    ...UploadImageEntity
  }
}

query InbaReleaseBySlug($slug: String!) {
  inbaReleases(filters: { slug: { eq: $slug } }) {
    ...InbaReleaseEntity
  }
}

query InbaReleasesStaticPaths($limit: Int = -1) {
  inbaReleases(sort: "releaseDate:desc", pagination: { limit: $limit }) {
    documentId
    slug
  }
}

query InbaReleasesRssFeed {
  inbaReleases(sort: "releaseDate:desc", pagination: { limit: -1 }) {
    ...InbaReleaseCardEntity
  }
}

query HomepageLatestInbaRelease {
  inbaReleases(sort: "releaseDate:desc", pagination: { limit: 1 }) {
    ...InbaReleaseHomepageInbaCardEntity
  }
}

query LatestInbaRelease {
  inbaReleases(sort: "releaseDate:desc", pagination: { limit: 1 }) {
    ...InbaReleaseEntity
  }
}

# Used by the /api/content-inventory endpoint.
fragment InbaReleaseInventoryEntity on InbaRelease {
  ...InbaReleaseSlugEntity
  perex
  releaseDate
  updatedAt
  publishedAt
  files {
    ...FileBlock
  }
  articles(pagination: { limit: -1 }) {
    ...ArticleSlugEntity
  }
}

query InbaReleasesInventory($start: Int = 0, $limit: Int = 100) {
  inbaReleases(sort: "id:asc", pagination: { start: $start, limit: $limit }) {
    ...InbaReleaseInventoryEntity
  }
}
