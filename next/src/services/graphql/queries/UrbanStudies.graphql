fragment UrbanStudyPartItem on ComponentBlocksUrbanStudyPartItem {
  id
  title
  media {
    ...UploadFileEntity
  }
}

fragment UrbanStudyPart on ComponentSectionsUrbanStudyPart {
  title
  text
  items(pagination: { limit: -1 }) {
    ...UrbanStudyPartItem
  }
}

fragment UrbanStudyCategoryEntity on UrbanStudyCategory {
  documentId
  slug
  title
}

fragment UrbanStudyStateEntity on UrbanStudyState {
  documentId
  slug
  title
}

fragment UrbanStudySlugEntity on UrbanStudy {
  __typename
  documentId
  slug
  title
}

fragment UrbanStudyEntity on UrbanStudy {
  ...UrbanStudySlugEntity
  publishedAt
  updatedAt
  year
  urbanStudyCategory {
    ...UrbanStudyCategoryEntity
  }
  procuredBy
  preparedBy
  body
  approvalText
  urbanStudyParts {
    ...UrbanStudyPart
  }
  regulations {
    ...RegulationEntity
  }
  links {
    ...CommonLink
  }
}

query UrbanStudyBySlug($slug: String!) {
  urbanStudies(filters: { slug: { eq: $slug } }) {
    ...UrbanStudyEntity
  }
}

query UrbanStudiesStaticPaths($limit: Int = -1) {
  urbanStudies(pagination: { limit: $limit }) {
    documentId
    slug
  }
}

# Used by the /api/content-inventory endpoint.
fragment UrbanStudyInventoryEntity on UrbanStudy {
  ...UrbanStudySlugEntity
  updatedAt
  publishedAt
  customPublishedAt
  year
  urbanStudyCategory {
    ...UrbanStudyCategoryEntity
  }
  urbanStudyState {
    ...UrbanStudyStateEntity
  }
  urbanStudyParts {
    items(pagination: { limit: -1 }) {
      ...UrbanStudyPartItem
    }
  }
  regulations(pagination: { limit: -1 }) {
    ...RegulationRelationEntity
  }
}

query UrbanStudiesInventory($start: Int = 0, $limit: Int = 100) {
  urbanStudies(sort: "id:asc", pagination: { start: $start, limit: $limit }) {
    ...UrbanStudyInventoryEntity
  }
}
