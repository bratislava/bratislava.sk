fragment AssetCategoryEntity on AssetCategory {
  documentId
  title
  slug
}

fragment AssetSlugEntity on Asset {
  __typename
  documentId
  slug
  title
}

fragment AssetEntity on Asset {
  ...AssetSlugEntity
  publishedAt
  updatedAt
  assetCategory {
    ...AssetCategoryEntity
  }
  description
  files {
    ...UploadFileEntity
  }
}

query AssetsStaticPaths($limit: Int = -1) {
  assets(sort: "updatedAt:desc", pagination: { limit: $limit }) {
    documentId
    slug
  }
}

query AssetBySlug($slug: String!) {
  assets(filters: { slug: { eq: $slug } }) {
    ...AssetEntity
  }
}

query AssetCategories {
  assetCategories(pagination: { limit: -1 }) {
    ...AssetCategoryEntity
  }
}

# Used by the /api/content-inventory endpoint.
fragment AssetInventoryEntity on Asset {
  ...AssetSlugEntity
  updatedAt
  publishedAt
  customPublishedAt
  description
  assetCategory {
    ...AssetCategoryEntity
  }
  files {
    ...UploadFileEntity
  }
}

query AssetsInventory($limit: Int = -1) {
  assets(sort: "updatedAt:desc", pagination: { limit: $limit }) {
    ...AssetInventoryEntity
  }
}
