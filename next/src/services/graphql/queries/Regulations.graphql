fragment RegulationCategoryEntity on RegulationCategory {
  documentId
  title
  slug
  pictogram
}

query RegulationsStaticPaths($limit: Int = -1) {
  regulations(sort: "updatedAt:desc", pagination: { limit: $limit }) {
    documentId
    slug
  }
}

query RegulationBySlug($slug: String) {
  regulations(filters: { slug: { eq: $slug } }) {
    ...RegulationEntity
  }
}

fragment RegulationSlugEntity on Regulation {
  documentId
  slug
  titleText
}

# The shape a regulation is referenced by from another regulation (amendments, cancellations).
fragment RegulationRelationEntity on Regulation {
  documentId
  regNumber
  slug
  effectiveFrom
}

fragment RegulationEntity on Regulation {
  ...RegulationSlugEntity
  regNumber
  fullTitle
  effectiveFrom
  regulationCategory {
    ...RegulationCategoryEntity
  }
  isFullTextRegulation
  mainDocument {
    ...UploadFileEntity
  }
  attachments {
    ...UploadFileEntity
  }
  amendments {
    ...RegulationRelationEntity
    isFullTextRegulation
    attachments {
      ...UploadFileEntity
    }
  }
  amending {
    ...RegulationRelationEntity
    cancellation {
      ...RegulationRelationEntity
    }
    amending {
      ...RegulationRelationEntity
      cancellation {
        ...RegulationRelationEntity
      }
    }
  }
  cancellation {
    ...RegulationRelationEntity
  }
  cancelling {
    ...RegulationRelationEntity
  }
}

# Used by the /api/content-inventory endpoint. `cancellation` is the regulation cancelling this one, `amending` are
# the regulations this one amends - a cancelled amendee cancels this one too, see getRegulationMetadata.ts.
fragment RegulationInventoryEntity on Regulation {
  ...RegulationSlugEntity
  ...RegulationRelationEntity
  fullTitle
  category
  regulationCategory {
    ...RegulationCategoryEntity
  }
  updatedAt
  publishedAt
  cancellation {
    ...RegulationRelationEntity
  }
  amending(pagination: { limit: -1 }) {
    ...RegulationRelationEntity
    cancellation {
      ...RegulationRelationEntity
    }
  }
  amendments(pagination: { limit: -1 }) {
    ...RegulationRelationEntity
  }
  cancelling(pagination: { limit: -1 }) {
    ...RegulationRelationEntity
  }
  mainDocument {
    ...UploadFileEntity
  }
  attachments {
    ...UploadFileEntity
  }
}

query RegulationsInventory($start: Int = 0, $limit: Int = 100) {
  regulations(sort: "id:asc", pagination: { start: $start, limit: $limit }) {
    ...RegulationInventoryEntity
  }
}
