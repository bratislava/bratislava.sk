fragment ParentPage on Page {
  documentId
  locale
  title
  path
}

fragment PageParentPages on Page {
  ...ParentPage
  parentPage {
    ...ParentPage
    parentPage {
      ...ParentPage
      parentPage {
        ...ParentPage
        parentPage {
          ...ParentPage
        }
      }
    }
  }
}

fragment PageSlugEntity on Page {
  documentId
  title
  locale
  path
}

fragment PageCardEntity on Page {
  ...PageSlugEntity
  pageBackgroundImage {
    ...UploadImageSrcEntity
  }
}

fragment PageCardWithHeadersEntity on Page {
  ...PageCardEntity
  pageHeaderSections {
    ...PageHeaderSections
  }
}

fragment PageEntity on Page {
  ...PageCardEntity
  alias
  subtext
  pageColor
  metaDescription
  keywords
  showTableOfContents
  adminGroups {
    ...AdminGroupEntity
  }
  headerLinks {
    ...CommonLink
  }
  pageHeaderSections {
    ...PageHeaderSections
  }
  subnavigation {
    ...SubnavigationSection
  }
  sections {
    ...Sections
  }
  sidebar {
    ...Sidebars
  }
  localizations {
    path
    locale
  }
  relatedContents {
    ...TagEntity
  }
  ...PageParentPages
  hasWaves
}

query PagesStaticPaths(
  $limit: Int = -1
  $locale: I18NLocaleCode = "*"
  $sort: [String] = ["updatedAt:desc"]
) {
  pages(locale: $locale, sort: $sort, pagination: { limit: $limit }) {
    documentId
    path
  }
}

query PagesStaticPathsForSitemap(
  $limit: Int = -1
  $locale: I18NLocaleCode = "*"
  $sort: [String] = ["updatedAt:desc"]
) {
  pages(locale: $locale, sort: $sort, pagination: { limit: $limit }) {
    documentId
    path
    locale
    updatedAt
    localizations {
      documentId
      path
      locale
    }
  }
}

query PageByPath($path: String!, $locale: I18NLocaleCode!) {
  pages(filters: { path: { eq: $path } }, locale: $locale) {
    ...PageEntity
  }
}

# Based on OLO: https://github.com/bratislava/olo.sk/blob/master/next/src/services/graphql/queries/pages.gql
query PageRedirectByAlias($alias: String!, $locale: I18NLocaleCode!) {
  pages(filters: { alias: { eq: $alias } }, locale: $locale) {
    ...PageSlugEntity
  }
  articles(filters: { alias: { eq: $alias } }, locale: $locale) {
    ...ArticleSlugEntity
  }
}

query Dev_AllPages(
  $sort: [String]
  $limit: Int
  $start: Int
  $filters: PageFiltersInput
  $locale: I18NLocaleCode
) {
  pages(
    sort: $sort
    pagination: { limit: $limit, start: $start }
    filters: $filters
    locale: $locale
  ) {
    ...PageEntity
  }
}

mutation updatePage($documentId: ID!, $locale: I18NLocaleCode, $pageInput: PageInput!) {
  updatePage(documentId: $documentId, locale: $locale, data: $pageInput) {
    documentId
  }
}

# Used by the /api/content-inventory endpoint.
fragment PageInventoryEntity on Page {
  ...PageSlugEntity
  updatedAt
  publishedAt
  subtext
  metaDescription
  keywords
  adminGroups {
    ...AdminGroupSlugEntity
  }
  # Only the sections that carry files or link other content - the rest of the dynamic zone is not needed here.
  sections {
    __typename
    ... on ComponentSectionsAssets {
      assets(pagination: { limit: -1 }) {
        ...AssetSlugEntity
      }
    }
    ... on ComponentSectionsRegulations {
      regulations(pagination: { limit: -1 }) {
        ...RegulationRelationEntity
      }
    }
    ... on ComponentSectionsFileList {
      fileList(pagination: { limit: -1 }) {
        ...FileBlock
      }
    }
    ... on ComponentSectionsAccordion {
      flatText(pagination: { limit: -1 }) {
        fileList {
          ...FileItemBlock
        }
      }
    }
    ... on ComponentSectionsContactsSection {
      ...ContactsSection
    }
  }
}

query PagesInventory($start: Int = 0, $limit: Int = 100, $locale: I18NLocaleCode = "sk") {
  pages(locale: $locale, sort: "id:asc", pagination: { start: $start, limit: $limit }) {
    ...PageInventoryEntity
  }
}
