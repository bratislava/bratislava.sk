name: Strapi/Next deploy pipeline
on:
  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master

# Tag prefix picks the cluster: `<env>` = Strapi then Next, `<env>-strapi` / `<env>-next` = only that app.
# Push to master = whole staging deploy.
jobs:
  deploy-dev:
    name: after dev Strapi deploy Next
    if: startsWith(github.ref, 'refs/tags/dev') && !startsWith(github.ref, 'refs/tags/dev-strapi') && !startsWith(github.ref, 'refs/tags/dev-next')
    needs: deploy-dev-strapi
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: development
      url: https://dev.tkgis.bratislava.sk:6443
      debug: --debug
      version: beta
    secrets:
      service-account: ${{ secrets.DEV_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-dev-strapi:
    name: dev Strapi
    if: startsWith(github.ref, 'refs/tags/dev') && !startsWith(github.ref, 'refs/tags/dev-next')
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: strapi/
      cluster: development
      url: https://dev.tkgis.bratislava.sk:6443
      debug: --debug
      version: beta
    secrets:
      service-account: ${{ secrets.DEV_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-dev-next:
    name: dev Next
    if: startsWith(github.ref, 'refs/tags/dev-next')
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: development
      url: https://dev.tkgis.bratislava.sk:6443
      debug: --debug
      version: beta
    secrets:
      service-account: ${{ secrets.DEV_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-staging:
    name: after staging Strapi deploy Next
    if: github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/staging') && !startsWith(github.ref, 'refs/tags/staging-strapi') && !startsWith(github.ref, 'refs/tags/staging-next'))
    needs: deploy-staging-strapi
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: staging
      url: https://stage.tkgis.bratislava.sk:6443
      debug: --debug
      flag: --staging
    secrets:
      service-account: ${{ secrets.STAGING_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-staging-strapi:
    name: staging Strapi
    if: github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/staging') && !startsWith(github.ref, 'refs/tags/staging-next'))
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: strapi/
      cluster: staging
      url: https://stage.tkgis.bratislava.sk:6443
      debug: --debug
      flag: --staging
    secrets:
      service-account: ${{ secrets.STAGING_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-staging-next:
    name: staging Next
    if: startsWith(github.ref, 'refs/tags/staging-next')
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: staging
      url: https://stage.tkgis.bratislava.sk:6443
      debug: --debug
      flag: --staging
    secrets:
      service-account: ${{ secrets.STAGING_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-prod:
    name: after prod Strapi deploy Next
    if: startsWith(github.ref, 'refs/tags/prod') && !startsWith(github.ref, 'refs/tags/prod-strapi') && !startsWith(github.ref, 'refs/tags/prod-next')
    needs: deploy-prod-strapi
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: production
      url: https://prod.tkgis.bratislava.sk:6443
      flag: --production
      debug: --debug
    secrets:
      service-account: ${{ secrets.PROD_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-prod-strapi:
    name: prod Strapi
    if: startsWith(github.ref, 'refs/tags/prod') && !startsWith(github.ref, 'refs/tags/prod-next')
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: strapi/
      cluster: production
      url: https://prod.tkgis.bratislava.sk:6443
      flag: --production
      debug: --debug
    secrets:
      service-account: ${{ secrets.PROD_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}

  deploy-prod-next:
    name: prod Next
    if: startsWith(github.ref, 'refs/tags/prod-next')
    uses: bratislava/github-actions/.github/workflows/deploy-with-bratiska-cli-inhouse.yml@v2.4.0
    with:
      directory: next/
      cluster: production
      url: https://prod.tkgis.bratislava.sk:6443
      flag: --production
      debug: --debug
    secrets:
      service-account: ${{ secrets.PROD_STANDALONE_TOKEN }}
      registry-pass: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
      sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
