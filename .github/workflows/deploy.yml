name: Strapi/Next deploy pipeline
on:
  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Environment and Services
    runs-on: bratislava
    outputs:
      cluster: ${{ steps.resolve.outputs.cluster }}
      next: ${{ steps.resolve.outputs.next }}
      strapi: ${{ steps.resolve.outputs.strapi }}
    steps:
      - name: Map ref to environment and services
        id: resolve
        run: |
          REF="$GITHUB_REF"

          if [[ "$REF" == "refs/heads/master" ]]; then
            CLUSTER="staging"
            ONLY="all"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            case "$TAG" in
              dev*)     CLUSTER="development"; REST="${TAG#dev}" ;;
              staging*) CLUSTER="staging";     REST="${TAG#staging}" ;;
              prod*)    CLUSTER="production";  REST="${TAG#prod}" ;;
              *)
                echo "::error::Unable to determine environment from tag: $TAG"
                exit 1
                ;;
            esac

            # A bare environment tag (e.g. dev1.2.3) deploys the whole project,
            # a service-suffixed tag (e.g. dev-strapi1.2.3) deploys only that
            # service.
            case "$REST" in
              -next*)   ONLY="next" ;;
              -strapi*) ONLY="strapi" ;;
              *)        ONLY="all" ;;
            esac
          else
            echo "::error::Unable to determine environment from ref: $REF"
            exit 1
          fi

          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"

          {
            echo "## Pipeline info :rocket:"
            echo ":arrow_right: Ref: **$REF**"
            echo ":arrow_right: Cluster: **$CLUSTER**"
            echo "### We are going to deploy :ship:"
          } >> "$GITHUB_STEP_SUMMARY"

          for SVC in next strapi; do
            if [[ "$ONLY" == "all" || "$ONLY" == "$SVC" ]]; then
              echo "$SVC=true" >> "$GITHUB_OUTPUT"
              echo ":soon: **$SVC**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$SVC=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # ---- Strapi: build+push, then deploy ----
  # Strapi goes first. `next build` prerenders against the live Strapi of the
  # target cluster, so Next cannot even be built until the new Strapi is up.
  build-strapi:
    name: Build Strapi
    needs: resolve
    if: needs.resolve.outputs.strapi == 'true'
    uses: ./.github/workflows/build-single-image.yml
    secrets: inherit
    with:
      directory: strapi/
      image: harbor.bratislava.sk/standalone/bratislava-strapi
      cluster: ${{ needs.resolve.outputs.cluster }}

  deploy-strapi:
    name: Strapi
    needs: [resolve, build-strapi]
    if: needs.resolve.outputs.strapi == 'true'
    uses: bratislava/github-actions/.github/workflows/trigger-infra-deploy.yml@v3.0.0
    secrets: inherit
    with:
      cluster: ${{ needs.resolve.outputs.cluster }}
      app: bratislava.sk/strapi

  # ---- Next: build+push against the deployed Strapi, then deploy ----
  # When Strapi is out of scope (a *-next tag) deploy-strapi is skipped, which
  # is why these gate on !failure() && !cancelled() rather than success().
  build-next:
    name: after Strapi deploy build Next
    needs: [resolve, deploy-strapi]
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.next == 'true' }}
    uses: ./.github/workflows/build-next.yml
    secrets: inherit
    with:
      directory: next/
      image: harbor.bratislava.sk/standalone/bratislava-next
      cluster: ${{ needs.resolve.outputs.cluster }}

  deploy-next:
    name: Next
    needs: [resolve, build-next]
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.next == 'true' }}
    uses: bratislava/github-actions/.github/workflows/trigger-infra-deploy.yml@v3.0.0
    secrets: inherit
    with:
      cluster: ${{ needs.resolve.outputs.cluster }}
      app: bratislava.sk/next
